<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Academic Calculator</title>
    <script>
      (function() {
        var isGitHubPages = window.location.hostname.includes('github.io');
        var repoName = isGitHubPages ? '/University-Academic-Calculator' : '';
        var path = window.location.pathname;
        if (repoName && path.startsWith(repoName)) {
          path = path.slice(repoName.length);
        }
        if (!path || path === '/') {
          window.location.replace(window.location.origin + repoName + '/');
        } else {
          window.location.replace(window.location.origin + (repoName ? repoName : '') + '/#' + path + window.location.search);
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to Academic Calculator...</p>
  </body>
</html>
