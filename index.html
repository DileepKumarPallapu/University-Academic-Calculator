    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />

    <meta name="description" content="Simple tools for calculating Internal Marks, SGPA, CGPA and Attendance." />
    
    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="University Academic Calculator" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="University Academic Calculator" />
    <meta name="twitter:description" content="Simple tools for calculating Internal Marks, SGPA, CGPA and Attendance." />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('academic_calculator_theme') || localStorage.getItem('academic_calc_theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
